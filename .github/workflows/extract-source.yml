name: Expand source for development

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/extract-source.yml" ]

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble source bundle
        shell: bash
        run: |
          cat bundle/chunk-* > context-reminder-source.tar.gz.b64
          base64 --decode context-reminder-source.tar.gz.b64 > context-reminder-source.tar.gz
          echo "a89bbf2e7c7d5f63c6dc533a6684c1064f878e89af609718b87d4975f4f690a3  context-reminder-source.tar.gz" | sha256sum --check
          tar -xzf context-reminder-source.tar.gz

          # Persist the compatibility changes that were previously applied only during CI.
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          sed -i '/id("org.jetbrains.kotlin.android")/d' app/build.gradle.kts
          sed -i '/    kotlinOptions {/,/    }/d' app/build.gradle.kts
          sed -i '/val composeBom = platform("androidx.compose:compose-bom:2026.08.00")/d' app/build.gradle.kts
          sed -i '/implementation(composeBom)/d' app/build.gradle.kts
          sed -i '/androidTestImplementation(composeBom)/d' app/build.gradle.kts
          sed -i 's#androidx.core:core-ktx:1.19.0#androidx.core:core-ktx:1.17.0#' app/build.gradle.kts
          sed -i 's#androidx.activity:activity-compose:1.13.0#androidx.activity:activity-compose:1.12.4#' app/build.gradle.kts
          sed -i 's#androidx.lifecycle:lifecycle-runtime-ktx:2.11.0#androidx.lifecycle:lifecycle-runtime-ktx:2.10.0#' app/build.gradle.kts
          sed -i 's#androidx.lifecycle:lifecycle-runtime-compose:2.11.0#androidx.lifecycle:lifecycle-runtime-compose:2.10.0#' app/build.gradle.kts
          sed -i 's#androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0#androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0#' app/build.gradle.kts
          sed -i 's#androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0#androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0#' app/build.gradle.kts
          sed -i 's#implementation("androidx.compose.ui:ui")#implementation("androidx.compose.ui:ui:1.11.4")#' app/build.gradle.kts
          sed -i 's#implementation("androidx.compose.ui:ui-tooling-preview")#implementation("androidx.compose.ui:ui-tooling-preview:1.11.4")#' app/build.gradle.kts
          sed -i 's#implementation("androidx.compose.foundation:foundation")#implementation("androidx.compose.foundation:foundation:1.11.4")#' app/build.gradle.kts
          sed -i 's#implementation("androidx.compose.material3:material3")#implementation("androidx.compose.material3:material3:1.4.0")#' app/build.gradle.kts
          sed -i 's#debugImplementation("androidx.compose.ui:ui-tooling")#debugImplementation("androidx.compose.ui:ui-tooling:1.11.4")#' app/build.gradle.kts
          sed -i '/import androidx.compose.foundation.layout.weight/d' app/src/main/java/com/contextreminder/app/AddRuleScreen.kt

          if ! grep -q 'runRuleEngineTests' core/build.gradle.kts; then
            cat >> core/build.gradle.kts <<'EOF'

          tasks.register<JavaExec>("runRuleEngineTests") {
              dependsOn(tasks.named("testClasses"))
              classpath = sourceSets["test"].runtimeClasspath
              mainClass.set("com.contextreminder.core.RuleEngineTestKt")
          }
          EOF
          fi

          rm -f context-reminder-source.tar.gz context-reminder-source.tar.gz.b64

      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app core settings.gradle.kts build.gradle.kts gradle.properties
          if [ -f .gitignore ]; then git add .gitignore; fi
          if git diff --cached --quiet; then
            echo "Source already expanded"
            exit 0
          fi
          git commit -m "chore: expand source bundle for development"
          git push
