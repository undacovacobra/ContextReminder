name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble source bundle
        shell: bash
        run: |
          cat bundle/chunk-* > context-reminder-source.tar.gz.b64
          base64 --decode context-reminder-source.tar.gz.b64 > context-reminder-source.tar.gz
          echo "a89bbf2e7c7d5f63c6dc533a6684c1064f878e89af609718b87d4975f4f690a3  context-reminder-source.tar.gz" | sha256sum --check
          tar -xzf context-reminder-source.tar.gz
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run core tests
        run: gradle :core:test --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ContextReminder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
