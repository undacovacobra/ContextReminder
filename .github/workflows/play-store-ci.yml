name: Play Store Branch CI

on:
  workflow_dispatch:
  push:
    branches: [ "play-store-release" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Run core tests
        run: gradle :core:runRuleEngineTests --stacktrace
